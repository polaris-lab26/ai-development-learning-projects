<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
</head>
<body>
  <h1>Contact us</h1>

  {% if errors %}
  <ul class="errors" style="color: #b00020;">
    {% for error in errors %}
    <li>{{ error }}</li>
    {% endfor %}
  </ul>
  {% endif %}

  <form method="post" action="/contact">
    <p>
      <label for="name">Name</label><br>
      <input type="text" id="name" name="name" value="{{ form.get('name', '') }}" required>
    </p>
    <p>
      <label for="email">Email</label><br>
      <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" required>
    </p>
    <p>
      <label for="message">Message</label><br>
      <textarea id="message" name="message" rows="6" cols="40" required>{{ form.get('message', '') }}</textarea>
    </p>
    <p>
      <button type="submit">Send</button>
    </p>
  </form>
</body>
</html>
