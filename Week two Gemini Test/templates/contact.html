<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        .error { color: red; font-size: 0.9em; margin-top: 5px; }
        button { padding: 10px 15px; font-size: 1em; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Contact Us</h1>

    <form action="/contact" method="POST" novalidate>
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="{{ form_data.name }}">
            {% if errors.name %}
                <div class="error">{{ errors.name }}</div>
            {% endif %}
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ form_data.email }}">
            {% if errors.email %}
                <div class="error">{{ errors.email }}</div>
            {% endif %}
        </div>

        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5">{{ form_data.message }}</textarea>
            {% if errors.message %}
                <div class="error">{{ errors.message }}</div>
            {% endif %}
        </div>

        <button type="submit">Send Message</button>
    </form>
</body>
</html>
